<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Wiring: 5 V supply, XIAO ESP32-S3 and LED strip</title>
  <rect width="720" height="470" rx="12" fill="#ffffff"/>

  <!-- power supply -->
  <rect x="40" y="50" width="180" height="90" rx="8" fill="#f1efe8" stroke="#5f5e5a"/>
  <text x="130" y="85" text-anchor="middle" font-size="15" font-weight="600" fill="#2c2c2a">5 V power supply</text>
  <text x="122" y="106" text-anchor="middle" font-size="12" fill="#5f5e5a">USB charger 2–3 A</text>
  <text x="208" y="75" text-anchor="end" font-size="15" font-weight="600" fill="#a32d2d">+</text>
  <text x="208" y="125" text-anchor="end" font-size="15" font-weight="600" fill="#2c2c2a">−</text>

  <!-- strip -->
  <rect x="540" y="50" width="140" height="170" rx="8" fill="#f1efe8" stroke="#5f5e5a"/>
  <text x="610" y="74" text-anchor="middle" font-size="15" font-weight="600" fill="#2c2c2a">LED strip</text>
  <text x="610" y="92" text-anchor="middle" font-size="12" fill="#5f5e5a">input end (5 V WS2812B)</text>
  <text x="552" y="125" font-size="13" fill="#2c2c2a">+5V</text>
  <text x="552" y="160" font-size="13" fill="#2c2c2a">DATA IN</text>
  <text x="552" y="200" font-size="13" fill="#2c2c2a">GND</text>

  <!-- ESP32 -->
  <rect x="230" y="300" width="230" height="120" rx="8" fill="#e1f5ee" stroke="#0f6e56"/>
  <text x="270" y="320" text-anchor="middle" font-size="12" fill="#085041">5V</text>
  <text x="330" y="320" text-anchor="middle" font-size="12" fill="#085041">GND</text>
  <text x="410" y="320" text-anchor="middle" font-size="12" fill="#085041">D10 (GPIO 9)</text>
  <text x="345" y="365" text-anchor="middle" font-size="15" font-weight="600" fill="#04342c">XIAO ESP32-S3</text>
  <text x="345" y="386" text-anchor="middle" font-size="12" fill="#0f6e56">running WLED</text>
  <text x="345" y="440" text-anchor="middle" font-size="12" fill="#5f5e5a">USB-C: flashing / updates (safe with the diode fitted)</text>

  <!-- +5V wire -->
  <path d="M220 70 H505 V125 H540" fill="none" stroke="#e24b4a" stroke-width="3" stroke-linejoin="round"/>
  <path d="M270 70 V200" fill="none" stroke="#e24b4a" stroke-width="3"/>
  <path d="M270 236 V300" fill="none" stroke="#e24b4a" stroke-width="3"/>
  <circle cx="270" cy="70" r="5" fill="#e24b4a"/>
  <!-- Schottky diode symbol (anode top, cathode bar bottom = towards ESP32) -->
  <polygon points="258,204 282,204 270,226" fill="#2c2c2a"/>
  <line x1="256" y1="228" x2="284" y2="228" stroke="#2c2c2a" stroke-width="3"/>
  <line x1="270" y1="200" x2="270" y2="204" stroke="#e24b4a" stroke-width="3"/>
  <line x1="270" y1="228" x2="270" y2="236" stroke="#e24b4a" stroke-width="3"/>
  <text x="250" y="220" text-anchor="end" font-size="12" fill="#2c2c2a">1N5817 diode</text>

  <!-- GND wire -->
  <path d="M220 120 H520 V200 H540" fill="none" stroke="#2c2c2a" stroke-width="3" stroke-linejoin="round"/>
  <path d="M330 120 V300" fill="none" stroke="#2c2c2a" stroke-width="3"/>
  <circle cx="330" cy="120" r="5" fill="#2c2c2a"/>

  <!-- capacitor across +5V / GND near strip -->
  <path d="M480 70 V88" fill="none" stroke="#e24b4a" stroke-width="3"/>
  <path d="M480 96 V120" fill="none" stroke="#2c2c2a" stroke-width="3"/>
  <path d="M468 88 H492 M468 96 H492" stroke="#2c2c2a" stroke-width="2.5"/>
  <circle cx="480" cy="70" r="5" fill="#e24b4a"/>
  <circle cx="480" cy="120" r="5" fill="#2c2c2a"/>
  <text x="480" y="52" text-anchor="middle" font-size="12" fill="#2c2c2a">1000 µF</text>

  <!-- data wire with resistor -->
  <path d="M410 300 V160 H440" fill="none" stroke="#3b6d11" stroke-width="3" stroke-linejoin="round"/>
  <rect x="440" y="151" width="44" height="18" rx="3" fill="#ffffff" stroke="#2c2c2a" stroke-width="1.5"/>
  <path d="M484 160 H540" fill="none" stroke="#3b6d11" stroke-width="3"/>
  <text x="462" y="186" text-anchor="middle" font-size="12" fill="#2c2c2a">330 Ω</text>

  <!-- legend -->
  <line x1="40" y1="455" x2="64" y2="455" stroke="#e24b4a" stroke-width="3"/><text x="70" y="459" font-size="12" fill="#2c2c2a">+5 V</text>
  <line x1="120" y1="455" x2="144" y2="455" stroke="#2c2c2a" stroke-width="3"/><text x="150" y="459" font-size="12" fill="#2c2c2a">GND</text>
  <line x1="196" y1="455" x2="220" y2="455" stroke="#3b6d11" stroke-width="3"/><text x="226" y="459" font-size="12" fill="#2c2c2a">data</text>
  <circle cx="280" cy="455" r="5" fill="#2c2c2a"/><text x="290" y="459" font-size="12" fill="#2c2c2a">joined</text>
</svg>
